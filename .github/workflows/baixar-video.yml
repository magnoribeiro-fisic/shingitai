name: Baixar video para edicao
on:
  workflow_dispatch:
    inputs:
      video:
        description: 'ID ou nome do video na pasta PARA EDITAR'
        required: true
      chave_publica:
        description: 'Chave publica RSA (PEM) gerada pelo Claude na conversa'
        required: true
permissions:
  contents: write
  id-token: write   # login no Google sem chave (Workload Identity Federation)
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/348938527666/locations/global/workloadIdentityPools/github/providers/shingitai
          service_account: robo-repost@project-ca1348c0-fd1f-46bf-b8c.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests google-auth
      - run: python robo-video/baixar.py
        env:
          VIDEO: ${{ inputs.video }}
          CHAVE_PUBLICA: ${{ inputs.chave_publica }}
      - name: Entregar em branch temporario (somente arquivos criptografados)
        run: |
          cd saida && split -b 45m -d video.enc video.enc.part && rm video.enc
          git init -q -b entrega && git add . && git -c user.name=robo -c user.email=robo@shingitai commit -q -m "video ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" entrega:video-${{ github.run_id }}

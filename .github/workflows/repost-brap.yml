name: Repost riibeiro -> brap
on:
  schedule:
    - cron: '47 10 * * *'   # 07:47 Brasilia
    - cron: '47 20 * * *'   # 17:47 Brasilia
    - cron: '47 23 * * *'   # 20:47 Brasilia
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # login no Google sem chave (Workload Identity Federation)
concurrency: repost-brap
jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/348938527666/locations/global/workloadIdentityPools/github/providers/shingitai
          service_account: robo-repost@project-ca1348c0-fd1f-46bf-b8c.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q requests pillow imagehash google-auth yt-dlp
      - run: python robo-repost/repost.py
        env:
          GCP_PROJECT: project-ca1348c0-fd1f-46bf-b8c
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Limpar branches de video (30 dias)
on:
  schedule:
    - cron: '17 6 * * *'   # 03:17 Brasilia, todo dia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar so branches video-* com mais de 30 dias
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          limite=$(date -u -d '30 days ago' +%s)
          for b in $(gh api repos/${{ github.repository }}/branches --paginate --jq '.[].name' | grep '^video-' || true); do
            d=$(gh api repos/${{ github.repository }}/commits/$b --jq '.commit.committer.date')
            if [ "$(date -u -d "$d" +%s)" -lt "$limite" ]; then
              gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$b && echo "apagado $b ($d)"
            fi
          done
